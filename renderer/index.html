<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Desktop Pet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 宠物画布：人 B 的 Pet 类在此绘制 -->
  <canvas id="pet-canvas" width="320" height="320"></canvas>

  <!-- 对话气泡容器：人 C 的 Bubble 类挂载于此 -->
  <div id="bubble-container"></div>

  <!-- 右键菜单容器：人 A 的 Menu 类挂载于此 -->
  <div id="menu-container"></div>

  <!-- 聊天面板：人 A 的 Chat 类挂载于此（Agent 回复在此呈现） -->
  <div id="chat-panel" class="chat-panel">
    <div class="chat-header">
      <span class="chat-title">桌宠管家</span>
      <button class="chat-close" title="收起">×</button>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-typing" id="chat-typing"></div>
    <div class="chat-input-wrap">
      <textarea class="chat-input" id="chat-input" rows="1" placeholder="对管家说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="chat-send" id="chat-send">发送</button>
    </div>
  </div>

  <!-- 模块加载顺序：先定义类，app.js 最后实例化与串联 -->
  <script src="pet.js"></script>
  <script src="pets/cat.js"></script>
  <script src="pets/dog.js"></script>
  <script src="pets/penguin.js"></script>
  <!-- 升级功能：自定义形象 -->
  <script src="pet-image-factory.js"></script>
  <script src="pet-creator.js"></script>
  <script src="status.js"></script>
  <script src="bubble.js"></script>
  <script src="menu.js"></script>
  <script src="chat.js"></script>
  <!-- B：Agent 大脑/工具/数据（先 store→tools 注册表→各工具→scheduler→llm→agent） -->
  <script src="agent/store/schedule-store.js"></script>
  <script src="agent/store/memo-store.js"></script>
  <script src="agent/tools/index.js"></script>
  <script src="agent/tools/weather.js"></script>
  <script src="agent/tools/schedule.js"></script>
  <script src="agent/tools/memo.js"></script>
  <script src="agent/tools/translate.js"></script>
  <script src="agent/tools/system.js"></script>
  <script src="agent/scheduler.js"></script>
  <script src="agent/llm.js"></script>
  <script src="agent/agent.js"></script>
  <!-- 本地 LLM 配置（含 Key，已 gitignore；缺失则走 mock） -->
  <script src="agent/config.local.js"></script>
  <script src="app.js"></script>
</body>
</html>
